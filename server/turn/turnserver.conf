# coturn config for Turbo Drive voice chat. Replace YOUR_PUBLIC_IP, YOUR_DOMAIN and YOUR_SECRET.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=YOUR_PUBLIC_IP
realm=YOUR_DOMAIN
fingerprint
use-auth-secret
static-auth-secret=YOUR_SECRET
min-port=49160
max-port=49200
no-multicast-peers
no-cli
total-quota=100
